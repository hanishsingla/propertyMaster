security:
    role_hierarchy:
        ROLE_SUPER_LICENSE: [ROLE_LICENSE]
        ROLE_LICENSE: [ROLE_AGENT , ROLE_ADMIN]
        ROLE_ADMIN: [ROLE_AGENT]
        ROLE_AGENT: [ROLE_USER]
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Security\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\ApiEntryPoint
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: App\Security\ApiAuthenticationSuccessHandler
                failure_handler: App\Security\ApiAuthenticationFailureHandler
            login_throttling:
                max_attempts: 5 # per minute, keyed by username+IP
            logout:
                path: api_auth_logout
                target: /
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week
                # 'updatedAt' resolves to AbstractEntity::getUpdatedAt()
                signature_properties: [ 'password', 'updatedAt' ]
                token_provider:
                    doctrine: true

    # Note: only the *first* matching access_control is used.
    # Fine-grained API auth is enforced per-endpoint via #[IsGranted]/voters.
    access_control:
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/csrf, roles: PUBLIC_ACCESS }
        - { path: ^/api/enums, roles: PUBLIC_ACCESS }
        - { path: ^/api/contact, roles: PUBLIC_ACCESS }
        - { path: ^/api/agents, roles: PUBLIC_ACCESS }
        - { path: ^/api/properties, roles: PUBLIC_ACCESS, methods: [GET] }
        # Write operations on properties/images require at least an agent
        # (ownership is refined by PropertyVoter). Gates anon before arg resolution.
        - { path: ^/api/properties, roles: ROLE_AGENT, methods: [POST, PATCH, DELETE] }
        - { path: ^/api/my, roles: ROLE_AGENT }
        - { path: ^/api/account, roles: ROLE_USER }
        - { path: ^/api/favourites, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
